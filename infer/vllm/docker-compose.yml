# =============================================================================
# vLLM 多模型推理服务 (双 RTX 4090)
# =============================================================================
# 框架/架构/快速开始见 README.md；踩坑记录见 note.md。
#
# 通过 Docker Compose profiles 管理多个模型,同一时间只运行一个:
#   - coder      → Qwen3-Coder-30B MoE (AWQ, ModelScope)
#   - qwen38     → Qwen3.8-27B 稠密 v0.27.1 无 MTP 对照 (AWQ, HuggingFace)
#   - qwen38-mtp → Qwen3.8-27B 稠密 v0.27.1 + MTP 推测解码(优化版)
#   - qwen36     → Qwen3.6-35B-A3B MoE 多模态 (AWQ, ModelScope)
#
# qwen38 分两个 profile 便于对照: 同一模型,同一引擎 v0.27.1,仅推测解码开/关
#
# 前提:
#   1. 模型已下载到 /root/edge/models (运行 bash download-model.sh <模型名>)
#   2. 镜像已拉取 (未成功则运行 bash retry-pull.sh)
#
# 用法:
#   启动 Coder:        docker compose --profile coder      up -d
#   启动 Qwen3.8 对照: docker compose --profile qwen38     up -d
#   启动 Qwen3.8 MTP:  docker compose --profile qwen38-mtp up -d
#   启动 Qwen3.6:      docker compose --profile qwen36     up -d
#   切换模型:          docker compose --profile <当前> down && docker compose --profile <目标> up -d
#   停止:              docker compose --profile coder --profile qwen38 --profile qwen38-mtp --profile qwen36 down
# =============================================================================

# ---- 公共配置锚点 ----
x-vllm-common: &vllm-common
  image: vllm/vllm-openai:v0.27.1 # vLLM OpenAI 兼容推理服务(0.27.1 起支持 Qwen3.8 MTP 推测解码)
  pull_policy: never # 禁止 compose 自动拉取,统一由 retry-pull.sh 负责
  restart: unless-stopped
  shm_size: 2g # v0.27.1+ MTP/多进程 shm_broadcast 需共享内存,默认 64MiB 不够 → Insufficient space in /dev/shm
  ports:
    # 仅绑定回环地址: 外部无法直连 18000, 强制所有流量经 new-api(hub) 网关做认证与审计。
    # 不要改成 0.0.0.0, 否则任何人可绕过网关免鉴权调用模型。
    # 注意: new-api 渠道 Base URL 与 Open WebUI 须用 127.0.0.1:18000 (两者均为 host 网络)。
    - "127.0.0.1:18000:8000" # 宿主127.0.0.1:18000 → 容器8000 (vLLM API)
  environment:
    HF_XET_HIGH_PERFORMANCE: "1" # 启用 Xet 高速传输(如启动时需联网拉取)
    HF_HOME: "/models/.cache/huggingface" # HF 缓存放模型卷内
  volumes:
    - /root/edge/models:/models:ro # 模型统一目录,只读挂载
    - vllm_cache:/root/.cache/vllm # torch.compile 缓存持久化(命名卷): 容器重建后缓存存活,不重编译
  networks:
    # 固定容器 IP: Prometheus(已接入 vllm_default) 用 172.21.0.2:8000 抓 /metrics。
    # 宿主 18000 只绑 127.0.0.1(强制走 new-api 网关鉴权),Prometheus 经宿主端口抓不到,
    # 故走容器网络内直连;IP 必须固定,否则容器重建后 IP 变化会导致"监控目标不可达"复发。
    default:
      ipv4_address: 172.21.0.2
  dns:
    - 114.114.114.114
    - 223.5.5.5
  dns_opt:
    - attempts:3
    - timeout:2
    - ndots:0
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all # 使用全部GPU(双4090)
            capabilities: [ gpu ]

services:
  # ---------- 模型 1: Qwen3-Coder-30B MoE ----------
  vllm-coder:
    <<: *vllm-common
    container_name: vllm-coder
    profiles: [ "coder" ]
    command:
      - --model=/models/Qwen3-Coder-30B-A3B-Instruct-AWQ # 模型权重路径
      - --tensor-parallel-size=2 # 双卡张量并行
      - --max-model-len=65536 # 最大上下文 64K
      - --gpu-memory-utilization=0.80 # 显存利用率,留20%给CUDA context/同机其他 GPU 容器
      - --dtype=auto # 自动匹配模型量化格式(AWQ)
      - --served-model-name=qwen3-coder-30b # 对外模型名,Open WebUI用此名选择
      - --enable-prefix-caching # 前缀缓存,多轮对话更快
      - --kv-cache-dtype=fp8 # FP8 KV cache:显存占用减半→KV容量翻倍,读写带宽减半→与其他 GPU 任务争带宽时解码更快
      - --max-num-seqs=4 # 最大并发序列数
      - --max-num-batched-tokens=8192 # prefill 批处理上限,长 prompt 首字更快(MoE 激活 3B,显存压力小)
      # 工具调用支持(Open WebUI 会发 tools 参数,不加会报错):
      #   auto tool choice requires --enable-auto-tool-choice and --tool-call-parser
      - --enable-auto-tool-choice # 启用自动工具选择
      - --tool-call-parser=qwen3_coder # Qwen3-Coder 专用工具解析器

  # ---------- 模型 2a: Qwen3.8-27B 对照 (v0.27.1, 无 MTP) ----------
  # 对照基线: 同一引擎 0.27.1, 仅关闭 MTP 推测解码,精确量化 MTP 的净收益。
  # (v0.26.0 历史基线见报告: tok/s 24.1 / TTFT 399ms)
  vllm-qwen38:
    <<: *vllm-common
    container_name: vllm-qwen38
    profiles: [ "qwen38" ]
    image: vllm/vllm-openai:v0.27.1 # 覆盖锚点镜像,与 MTP 版同引擎(对照时排除版本差异)
    command:
      - --model=/models/Qwen3.8-27B-W4A16-AWQ # 模型权重路径
      - --tensor-parallel-size=2 # 双卡张量并行
      - --max-model-len=32768 # 最大上下文 32K(稠密模型显存更紧)
      - --gpu-memory-utilization=0.90 # 显存利用率,留10%给CUDA context
      - --dtype=auto # 自动匹配量化格式(compressed-tensors)
      - --served-model-name=qwen38-27b # 对外模型名
      - --enable-prefix-caching # 前缀缓存
      - --kv-cache-dtype=fp8 # FP8 KV cache:容量翻倍+带宽减半,与后台计算任务共存时提升解码速度
      - --max-num-seqs=4 # 最大并发序列数
      - --max-num-batched-tokens=12288 # 与 MTP 版一致,排除批处理上限差异(对照无 MTP 时无需槽位余量)
      - --enable-auto-tool-choice # 启用自动工具选择
      - --tool-call-parser=qwen3_xml # vLLM 0.26.0 起 qwen3 解析器已改名为 qwen3_xml,用旧名会启动崩溃

  # ---------- 模型 2b: Qwen3.8-27B MTP (v0.27.1 + 推测解码) ----------
  # 优化版: MTP 推测解码 + 调优参数。MTP 需 vLLM ≥0.27.1 与模型自带 MTP 头。
  vllm-qwen38-mtp:
    <<: *vllm-common
    container_name: vllm-qwen38-mtp
    profiles: [ "qwen38-mtp" ]
    command:
      - --model=/models/Qwen3.8-27B-W4A16-AWQ # 模型权重路径
      - --tensor-parallel-size=2 # 双卡张量并行
      - --max-model-len=32768 # 最大上下文 32K(稠密模型显存更紧)
      - --gpu-memory-utilization=0.90 # 显存利用率,留10%给CUDA context
      - --dtype=auto # 自动匹配量化格式(compressed-tensors)
      - --served-model-name=qwen38-27b # 对外模型名
      - --enable-prefix-caching # 前缀缓存
      - --kv-cache-dtype=fp8 # FP8 KV cache:容量翻倍+带宽减半,与后台计算任务共存时提升解码速度
      - --max-num-seqs=4 # 最大并发序列数
      # prefill 批处理上限: 4096 → 12288 调优
      #   vLLM 源码 vllm/config/vllm.py _set_max_num_scheduled_tokens:
      #   max_num_scheduled_tokens = max_num_batched_tokens - (n-1)*max_num_seqs
      #   MTP(n=2,seqs=4) 下 delta=4, 4096-4=4092 < 8192 会告警
      #   "may lead to suboptimal performance"(草稿槽位被挤压) → 提到 12288 消除
      - --max-num-batched-tokens=12288
      - --enable-auto-tool-choice # 启用自动工具选择
      - --tool-call-parser=qwen3_xml # vLLM 0.26.0 起 qwen3 解析器已改名为 qwen3_xml,用旧名会启动崩溃
      # MTP 推测解码(需 vLLM ≥0.27.1 + 模型自带 MTP 头):
      #   Qwen3.8-27B 官方自带 model-mtp.safetensors,单次前向验证多 token
      #   ── 260823 实测结论(后台算力满载环境下) ──
      #   单请求串行:  +4% tok/s(24.1→25.0), TTFT -29%(262→186ms) ✅ 延迟收益
      #   并发4请求:   n=2: -40%(36.8 vs 61.5) | n=1: -27%(45.2 vs 61.5) ❌ 负优化
      #   官方文档佐证: 推测解码只适合"内存受限的低 QPS"负载,计算受限场景收益转负
      #   → 推荐: 延迟敏感低并发用本 profile; 吞吐优先/高并发用 qwen38(无MTP)
      - --speculative-config={"method":"mtp","num_speculative_tokens":2}

  # ---------- 模型 3: Qwen3.6-35B-A3B MoE 多模态 ----------
  # Qwen3.6-35B-A3B: MoE 35B总参/3B激活, 原生多模态(图像+视频), 混合注意力
  # (Gated DeltaNet 线性注意力 + 标准注意力), 上下文 128K。
  # 社区 AWQ W4A16 (tclf90, 25.5GB) → TP2 每卡 ~12.8GB, 双 4090 可全量装载。
  # 与 qwen38 同为 MoE 轻激活, 参数沿用 qwen38 已调优配置; MTP 默认关闭
  # (260823 实测: 计算受限环境下并发 MTP 为负优化 -27%~-40%)。
  vllm-qwen36:
    <<: *vllm-common
    container_name: vllm-qwen36
    profiles: [ "qwen36" ]
    command:
      - --model=/models/Qwen3.6-35B-A3B-AWQ # 模型权重路径
      - --tensor-parallel-size=2 # 双卡张量并行
      - --max-model-len=65536 # 最大上下文 64K(FP8 KV + 10/40 层全注意力, 每卡 KV 容量 ~115 万 token, 64K 余量充足)
      - --gpu-memory-utilization=0.90 # 显存利用率
      - --dtype=auto # 自动匹配量化格式(AWQ)
      - --served-model-name=qwen3.6-35b # 对外模型名
      - --enable-prefix-caching # 前缀缓存
      - --kv-cache-dtype=fp8 # FP8 KV cache: 容量翻倍+带宽减半
      - --max-num-seqs=4 # 最大并发序列数
      - --max-num-batched-tokens=12288 # MoE 激活 3B, 批处理上限可放宽
      - --enable-auto-tool-choice # 启用自动工具选择
      - --tool-call-parser=qwen3_xml # Qwen3 系列统一 XML 工具解析器
      # 思考模式说明 (260824 修复):
      #   vLLM 0.27.1 自带 qwen3 reasoning parser(vllm/reasoning/qwen3_engine_reasoning_parser.py),
      #   注册名 qwen3。启用后把 <think>...</think> 拆到 reasoning_content, content 只留正式回答,
      #   Open WebUI 可折叠思考, 不再出现"思考混入 content + 前端循环显示"的问题。
      #   注意: reasoning parser 与 tool-call-parser 相互独立, 可同时启用。
      - --reasoning-parser=qwen3
      - '--default-chat-template-kwargs={"enable_thinking": true}'
      # 多模态(图像+视频): 模型自带 preprocessor_config, vLLM 自动启用;

  # ---------- Open WebUI ----------
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    container_name: vllm-webui
    restart: unless-stopped
    network_mode: host # host网络
    # 不加 depends_on: 无 profile 的 service 不能依赖有 profile 的 service,
    # 且两个模型共用 18000 端口,WebUI 通过 API 地址连接,与 service 名字无关。
    environment:
      PORT: "8081" # 8080 让给 Caddy 网关(公网2029→8080),WebUI 改 8081 直连/网关 /webui 转发
      # vLLM 是 OpenAI 协议,必须用 OpenAI 兼容连接。注意:新版 Open WebUI
      # 用【复数】变量 OPENAI_API_BASE_URLS/OPENAI_API_KEYS,单数变量不生效。
      # 不能用 OLLAMA_BASE_URL 指向 vLLM,否则会走 Ollama 协议(/api/tags)导致模型列表为空。
      OPENAI_API_BASE_URLS: "http://127.0.0.1:18000/v1"
      OPENAI_API_KEYS: "dummy" # vLLM 不校验 key,占位即可
      WEBUI_AUTH: "False" # 关闭登录
      # RAG 嵌入: 需单独提供嵌入服务(见 note.md)。此处先不依赖 Ollama
      OFFLINE_MODE: "true" # 禁止启动时从HF下载任何模型
      HTTPS_PROXY: "http://127.0.0.1:7890"
      HTTP_PROXY: "http://127.0.0.1:7890"
      NO_PROXY: "127.0.0.1,localhost,vllm,open-webui,huggingface.co,*.huggingface.co"
    volumes:
      - openwebui_data:/app/backend/data
      - webui_hf_cache:/app/backend/data/cache/huggingface

networks:
  # 固定子网,配合服务内 ipv4_address 固定 vLLM 容器 IP(监控抓取依赖此 IP)。
  # 名称显式写成 vllm_default,与 compose 默认网络名一致,避免重建时另建网络。
  default:
    name: vllm_default
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  openwebui_data:
  webui_hf_cache:
  vllm_cache: # torch.compile 缓存持久卷: down/up 切换模型后不重编译
