# 按宿主机、容器、GPU 三类资源拆分规则，便于后续扩展。
# 告警名与摘要均使用中文，通知只带 summary，方便手机查看。
groups:
  - name: obs-host-alerts
    rules:
      - alert: 主机CPU使用率过高
        # 持续 10 分钟超过 90% 才告警，避免短时尖峰噪声。
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率超 90%"

      - alert: 主机内存使用率过高
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率超 90%"

      - alert: 主机磁盘空间不足
        # 排除虚拟/临时文件系统（tmpfs 等），保留真实磁盘与容器根分区（overlay）。
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|configfs|devpts|proc|sysfs|cgroup|mqueue|shm|autofs|fuse\\..*|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|configfs|devpts|proc|sysfs|cgroup|mqueue|shm|autofs|fuse\\..*|nsfs"}) * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "磁盘剩余低于 10%"

  - name: obs-container-alerts
    rules:
      - alert: 监控目标不可达
        expr: up == 0
        # 任一采集目标持续不可达 5 分钟直接告警。
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "监控目标 {{ $labels.job }} 不可达"

      - alert: 容器CPU使用率过高
        # 相对 CPU 配额计算：usage 速率(核) / 配额核数(quota/100000)，无配额容器按单核计。
        expr: (rate(container_cpu_usage_seconds_total{name!=""}[5m]) / clamp_min(container_spec_cpu_quota{name!=""} / 100000, 1)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "容器 {{ $labels.name }} CPU 超 90%"

      - alert: 容器内存使用率过高
        # 只对设置了内存限制的容器计算比例，避免除以 0。
        expr: ((container_memory_working_set_bytes{name!=""} / clamp_min(container_spec_memory_limit_bytes{name!=""}, 1)) * 100 > 90) and on(name) (container_spec_memory_limit_bytes{name!=""} > 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "容器 {{ $labels.name }} 内存超 90%"

  - name: obs-gpu-alerts
    rules:
      - alert: GPU温度过高
        # 4090 长时间高温会影响稳定性，先用 85 度做预警阈值。
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} 温度超 85 度"

      - alert: GPU显存占用过高
        # 分母 = USED + FREE + RESERVED（总显存），避免缺 RESERVED 导致占比虚高。
        expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE + DCGM_FI_DEV_FB_RESERVED)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} 显存占用超 90%"

      - alert: GPU利用率过低
        # 显存占用 >50%（有模型驻留）但利用率 <50% 持续 15 分钟，视为服务异常/空闲；
        # 机器空闲（显存低）时不触发，避免误报。
        expr: (DCGM_FI_DEV_GPU_UTIL < 50) and on(gpu) (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE + DCGM_FI_DEV_FB_RESERVED)) * 100 > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} 显存占用高但利用率低"
