# 按宿主机、容器、GPU 三类资源拆分规则，便于后续扩展。
# 告警名与摘要均使用中文，通知只带 summary，方便手机查看。
groups:
  - name: obs-host-alerts
    rules:
      - alert: 主机CPU使用率过高
        # 持续 10 分钟超过 90% 才告警，避免短时尖峰噪声。
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率超 90%"

      - alert: 主机内存使用率过高
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率超 90%"

      - alert: 主机磁盘空间不足
        # 排除虚拟/临时文件系统（tmpfs 等），保留真实磁盘与容器根分区（overlay）。
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|configfs|devpts|proc|sysfs|cgroup|mqueue|shm|autofs|fuse\\..*|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|squashfs|iso9660|configfs|devpts|proc|sysfs|cgroup|mqueue|shm|autofs|fuse\\..*|nsfs"}) * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "磁盘剩余低于 10%"

  - name: obs-container-alerts
    rules:
      - alert: 监控目标不可达
        expr: up == 0
        # 任一采集目标持续不可达 5 分钟直接告警。
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "监控目标 {{ $labels.job }} 不可达"

      - alert: 容器CPU使用率过高
        # 相对 CPU 配额计算：usage 速率(核) / 配额核数(quota/100000)，无配额容器按单核计。
        expr: (rate(container_cpu_usage_seconds_total{name!=""}[5m]) / clamp_min(container_spec_cpu_quota{name!=""} / 100000, 1)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "容器 {{ $labels.name }} CPU 超 90%"

      - alert: 容器内存使用率过高
        # 只对设置了内存限制的容器计算比例，避免除以 0。
        expr: ((container_memory_working_set_bytes{name!=""} / clamp_min(container_spec_memory_limit_bytes{name!=""}, 1)) * 100 > 90) and on(name) (container_spec_memory_limit_bytes{name!=""} > 0)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "容器 {{ $labels.name }} 内存超 90%"

  - name: obs-gpu-alerts
    rules:
      - alert: GPU温度过高
        # RTX 4090 满载（vLLM 常驻）时 85°C 左右是常态，原 85°C 阈值会持续误报。
        # warning 提到 88°C（散热紧张/持续高负载），critical 92°C 逼近降频线再升级。
        expr: DCGM_FI_DEV_GPU_TEMP > 88
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} 温度超 88 度"

      - alert: GPU温度严重过高
        expr: DCGM_FI_DEV_GPU_TEMP > 92
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} 温度超 92 度，逼近降频线"

      # 原"GPU显存占用过高(>90%)"已删除：vLLM(--gpu-memory-utilization=0.80)常驻下
      # 必然长期触发，造成告警疲劳；真实容量水位改由 vllm:kv_cache_usage_perc 监控（接入 vLLM 指标时补充）。
      # 此处保留最后一层保护：常态 vLLM 预留 20% 剩余不会触发，仅当可用显存被挤到 <1GiB
      # （异常进程抢占、CUDA OOM 前兆）时以 critical 告警。DCGM_FB 系列单位为字节。
      - alert: GPU显存几乎耗尽
        expr: DCGM_FI_DEV_FB_FREE < 1073741824
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} 可用显存低于 1GB"

      # 原"GPU利用率过低"已删除：vLLM 空闲待机时显存高占用、低利用率是正常状态，会误报服务异常。
      # 服务可用性改由 vLLM /health 探活与请求指标监控（接入 vLLM 指标时补充）。

  - name: obs-vllm-alerts
    rules:
      - alert: vLLM引擎休眠
        # engine_sleep_state 三态互斥（awake/weights_offloaded/discard_all），值为 1 表示处于该状态。
        # 权重被卸载或缓存被丢弃时推理服务不可用（恢复需重新加载权重），直接告警。
        expr: (vllm_engine_sleep_state{sleep_state="weights_offloaded"} == 1) or on(engine) (vllm_engine_sleep_state{sleep_state="discard_all"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "vLLM 引擎休眠，推理不可用"

      - alert: vLLM请求积压
        # 队列中等待的请求数持续过高，说明并发打满/容量不足，用户请求开始排队。
        expr: vllm_num_requests_waiting > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "vLLM 请求积压 {{ $value }} 个"

      - alert: vLLM请求错误
        # 5 分钟内出现以 error 结束的请求（模型异常/输入非法/引擎错误）。
        expr: increase(vllm_request_success_total{finished_reason="error"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "vLLM 5 分钟内出现 {{ $value }} 次推理错误"

      - alert: vLLM KV缓存紧张
        # KV cache 是推理并发上限，持续 >95% 意味着接近容量极限，可能出现 preemption/排队。
        expr: vllm_kv_cache_usage_perc > 95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "vLLM KV cache 使用率 {{ $value }}% 超 95%"
