# 全局抓取和规则计算周期，先用 15 秒平衡实时性和开销。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件由 Prometheus 启动时一并加载。
rule_files:
  - /etc/prometheus/alert_rules.yml

# 告警推送到 Alertmanager（同栈容器，服务名访问）。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus 自监控。
  # 注意：启动参数 --web.route-prefix=/prom 使所有路由(含 /metrics)带 /prom 前缀，
  # 此处必须用 /prom/metrics，否则 404 导致 up=0 触发"监控目标不可达"钉钉告警。
  - job_name: prometheus
    metrics_path: /prom/metrics
    static_configs:
      - targets: ["prometheus:9090"]

  # 宿主机系统指标。
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Docker 容器指标。
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # NVIDIA GPU 指标。
  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  # vLLM 推理服务指标（容器 vllm-qwen36，容器内 8000）。
  # 注意：宿主 18000 只绑定 127.0.0.1（强制流量走 new-api 网关鉴权），
  # 因此 Prometheus 无法通过宿主端口 18000 抓取（connection refused）→ 曾触发"监控目标不可达"。
  # 现改为容器网络内直连：prometheus 已接入 vllm_default 网络，用容器 IP 访问 8000，
  # 不暴露任何宿主端口，也不依赖 wireguard/TUN 等外部链路。
  # （docker 内嵌 DNS 在本机解析容器名失败，故用 IP；IP 由 vllm_default 网络分配）
  - job_name: vllm
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["172.21.0.2:8000"]
    metric_relabel_configs:
      # vLLM 指标名带冒号前缀（vllm:xxx），Prometheus 虽然支持冒号，
      # 但部分下游（Grafana/文本查询）兼容性差，统一改成 vllm_xxx。
      - source_labels: [__name__]
        regex: "^vllm:(.+)$"
        target_label: __name__
        replacement: "vllm_$1"
