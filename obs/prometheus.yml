# 全局抓取和规则计算周期，先用 15 秒平衡实时性和开销。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件由 Prometheus 启动时一并加载。
rule_files:
  - /etc/prometheus/alert_rules.yml

# 告警推送到 Alertmanager（同栈容器，服务名访问）。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus 自监控。
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # 宿主机系统指标。
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Docker 容器指标。
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # NVIDIA GPU 指标。
  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]
