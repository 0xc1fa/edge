# 样例工程：数据库管理页面(Adminer) + 数据库(PostgreSQL)
#
# 部署方式（test 用户自助）：
#   1. 登录 https://10.8.0.8:9443 → 环境 dind-platform → Stacks → Add stack
#   2. 名称填 demo-app，Build method 选 "Web editor"，粘贴本文件全部内容
#   3. Deploy the stack
#
# 访问验证：
#   - 管理页面:  http://10.8.0.8:8091
#       登录信息（服务器已默认填 db）:
#         系统: PostgreSQL / 服务器: db / 用户名: app / 密码: app123 / 数据库: appdb
#   - 数据库直连: 10.8.0.8:5433 （任意 PG 客户端，用户名 app / 密码 app123）
#
# 镜像说明：dind 已配置 registry-mirrors=http://10.8.0.8:6000，
#           官方镜像用短名即可，自动经内网 proxy-cache 拉取（首次回源 Docker Hub 并缓存）。
#           带前缀镜像（如 bitnami/xx）mirror 不覆盖，需写完整地址 10.8.0.8:6000/library/xx
#           （insecure-registries 已信任，同样自助拉取，无需管理员预导入）。

name: demo-app

services:
  # ---- 数据库管理页面 ----
  adminer:
    image: adminer:4
    container_name: demo-adminer
    restart: always
    ports:
      - "8091:8080"          # 外部 8091 → dind 8091（port-forward 已放行）
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    networks:
      - demo-net

  # ---- 数据库 ----
  db:
    image: postgres:16-alpine
    container_name: demo-db
    restart: always
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app123
      - POSTGRES_DB=appdb
    ports:
      - "5433:5432"          # 外部 5433 → dind 5433（port-forward 已放行）
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - demo-net

networks:
  demo-net:

volumes:
  db-data:
