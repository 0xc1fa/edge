# Portainer CE + DinD 隔离环境（单 compose 一键启动）
#
# 架构：
#   宿主 Docker ── 第1层
#     ├─ portainer(Server)：不挂宿主 socket，只通过 Agent 连 dind → 宿主容器不可见
#     ├─ registry-proxy：Docker Hub 代理缓存，dind 公共镜像自助拉取的唯一通道
#     ├─ gitea / registry / registry-ui：代码托管 + 私有镜像仓库（全局，宿主层）
#     └─ dind-platform：第2层 dockerd + GPU 卡0 穿透 → Portainer 的唯一环境
#
# 镜像供给链路：
#   Docker Hub ──(宿主代理)──▶ registry-proxy(10.8.0.8:6000) ──▶ dind 内 test 自助拉取
#   私有镜像（CI 构建产物）──▶ 10.8.0.8:5000（本栈 registry）
#   注意：dind 无外网（宿主透明代理只对本机进程生效），公共镜像必须经 registry-proxy
#
# 改进：
#   - dind 内自动启动 portainer-agent（镜像预置进镜像，不依赖 dind 外网）
#   - auto-register 服务通过 Portainer API 自动注册 dind 环境（幂等）
#   - 资源限制使用顶层 cpus/mem_limit（deploy.resources 在非 swarm 下不生效）
#   - 首次启动流程：docker compose up -d --build
#       前提：先执行 docker save portainer/agent:lts -o agent.tar（宿主已有镜像加速）
#
# 注意：
#   - 平台容器用 GPU 需穿透 /dev/nvidia* + 在 dind 内装 nvidia-container-toolkit
#   - GPU 整卡透传（4090 无法切分），穿透卡0；如需卡1 改 /dev/nvidia1

services:
  # ---- 管理平面：Portainer Server（不挂宿主 socket）----
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    command:
      - --admin-password-file=/run/secrets/portainer_admin_password
    secrets:
      - portainer_admin_password
    volumes:
      - portainer_data:/data
    ports:
      - "9443:9443"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - portainer-net
    # 注意：portainer-ce:lts 镜像无 /bin/sh，不能使用 CMD-SHELL 健康检查；
    # 就绪检测由 auto-register 脚本内部轮询 API 完成

    # ---- 公共镜像代理缓存：Docker Hub 代理，dind 自助拉取公共镜像的通道 ----
    # 必须 host 网络：宿主透明代理只对宿主进程生效，容器网桥出网受限（回源失败），
    # host 模式下 registry 直接监听宿主 6000（见 registry-proxy-config.yml http.addr）
  registry-proxy:
    container_name: registry-proxy
    image: registry:2.8.3
    restart: always
    network_mode: host
    volumes:
      - registry-proxy-data:/var/lib/registry
      - ./registry-proxy-config.yml:/etc/docker/registry/config.yml:ro
    environment:
      - TZ=Asia/Shanghai

  # ---- 代码托管 + 私有镜像仓库（自 deAI/infra/devops 并入，复用原数据卷 devops_*）----
  # 定位：全局基础设施，放宿主层，不进 dind，
  #       避免镜像供给(6000 proxy 只代理 library)、资源配额(16c/32g)、生命周期耦合
  # 访问：dind 内经 10.8.0.8:3100/5000 访问，daemon.json 已配 insecure-registries
  # 数据卷显式命名复用原卷，迁移后旧数据（仓库/镜像）不丢
  gitea:
    container_name: gitea
    image: gitea/gitea:1.23.8
    restart: always
    ports:
      # Web 界面，避开 Grafana 的 3000
      - "3100:3000"
      # SSH 克隆（宿主机 :2222 → 容器 :22）
      - "2222:22"
    volumes:
      - devops_gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - portainer-net

  # 私有 Docker 镜像仓库（API，:5000），与 registry-proxy(:6000) 职责不同：
  # 5000 私有镜像（CI push 目标），6000 Docker Hub 公共镜像代理（dind 拉取通道）
  # host 网络：mihomo TUN 策略路由(ip rule 5270 lookup 52)会劫持 dockerd 的
  # DNAT 后流量(目标172.22.0.6→物理网卡黑洞)，curl 走 local 递送不受影响；
  # 改 host 网络后 daemon 经 local 递送直连，与 registry-proxy(:6000) 同理
  registry:
    container_name: registry
    image: registry:2.8.3
    restart: always
    network_mode: host
    volumes:
      - devops_registry_data:/var/lib/registry
      - ./registry-config.yml:/etc/docker/registry/config.yml:ro
    environment:
      - TZ=Asia/Shanghai

  registry-ui:
    container_name: registry-ui
    image: joxit/docker-registry-ui:2.6.0
    restart: always
    ports:
      - "5100:80"
    environment:
      # registry 已改 host 网络，走宿主地址（不再用服务名）
      NGINX_PROXY_PASS_URL: "http://10.8.0.8:5000"
      REGISTRY_URL: ""
      DELETE_IMAGES: "true"
      TZ: "Asia/Shanghai"
    networks:
      - portainer-net

  # ---- 平台隔离 Docker 环境（第2层 dockerd + GPU 卡0 穿透）----
  dind-platform:
    container_name: dind-platform
    build:
      context: .
      dockerfile: Dockerfile
      # 构建时用 host 网络：容器网桥出网受限，apk 安装 toolkit 需走宿主网络
      network: host
    restart: always
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
      - TZ=Asia/Shanghai
    volumes:
      - dind-platform-data:/var/lib/docker
      # ===== nvidia-container-toolkit 宿主挂载方案（离线，不依赖 apk/外网）=====
      # 宿主已装 toolkit 1.19.1 + NVIDIA 驱动 590.48.01，全部以只读挂载进 dind：
      #   1. 驱动库（libcuda/libnvidia-* + libnvidia-container.so）→ hook 挂进最终容器
      #   2. glibc 运行库（/lib/x86_64-linux-gnu、/lib64）→ toolkit 二进制运行依赖
      #   3. toolkit 二进制（nvidia-ctk/runtime/hook/cli）→ 动态链接 glibc
      #   4. 修正版 config.toml（禁 load-kmods/ldconfig，适配 dind musl 环境）
      # 目标路径在 alpine 内原本不存在，不会遮蔽系统库；宿主升级驱动无需重建镜像
      - /usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:ro
      - /lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:ro
      - /lib64:/lib64:ro
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
      - /usr/bin/nvidia-ctk:/usr/bin/nvidia-ctk:ro
      - /usr/bin/nvidia-container-runtime:/usr/bin/nvidia-container-runtime:ro
      - /usr/bin/nvidia-container-runtime-hook:/usr/bin/nvidia-container-runtime-hook:ro
      - /usr/bin/nvidia-container-cli:/usr/bin/nvidia-container-cli:ro
      # glibc 库缓存：nvidia-container-cli 探测驱动库需要读 /etc/ld.so.cache
      - /etc/ld.so.cache:/etc/ld.so.cache:ro
      # glibc 版 ldconfig（static-pie）：CLI 挂载库后在容器内跑它生成 .so 软链
      - /sbin/ldconfig.real:/sbin/ldconfig.real:ro
      - ./nvidia/config.toml:/etc/nvidia-container-runtime/config.toml:ro
    # GPU 卡0 穿透（如需卡1 改为 /dev/nvidia1）
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    # 资源上限（顶层属性，非 swarm 下真正生效；dind 及内部容器共用此上限）
    cpus: "16"
    mem_limit: 32g
    networks:
      - portainer-net
    healthcheck:
      test: [ "CMD", "docker", "info" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- 外部访问转发：socat 容器把外部流量送进 dind（方案A，不动 dind）----
  # 架构: 外部访问 10.8.0.8:<listen> → Docker NAT → port-forward 容器
  #       → socat 转发 → dind-platform:<port>（dind 内 docker-proxy 在收）
  # 加新服务: 在 PF_RULES 加一条规则，重启本容器即可，不用重启 dind
  port-forward:
    container_name: port-forward
    build:
      context: .
      dockerfile: Dockerfile.port-forward
      # 容器网桥出网受限，apk 装 socat 需走宿主网络
      network: host
    restart: always
    environment:
      # 规则: 监听端口:目标主机:目标端口（逗号分隔多条）
      # 目标主机用 compose 网络名 dind-platform，不依赖容器 IP 变化
      # 8001 → 样例工程 adminer（demo-app 在 dind 内已改为监听 8001，目标端口同为 8001）
      # 5433 → 样例工程 postgres；8002/8003/8004 → 其他团队应用部署预留（连续端口）
      # 3306 → MySQL 直连预留；5432 → PostgreSQL 直连预留
      # 新增服务：在此追加"监听端口:dind-platform:端口"，并在下方 ports 同步放行
      - PF_RULES=8001:dind-platform:8001,5433:dind-platform:5433,8002:dind-platform:8002,8003:dind-platform:8003,8004:dind-platform:8004,3306:dind-platform:3306,5432:dind-platform:5432
    ports:
      - "8001:8001"
      - "5433:5433"
      - "8002:8002"
      - "8003:8003"
      - "8004:8004"
      - "3306:3306"
      - "5432:5432"
    depends_on:
      dind-platform:
        condition: service_healthy
    networks:
      - portainer-net

  # ---- 自动注册：将 dind 环境注册到 Portainer（一次性任务，失败自动重试）----
  auto-register:
    container_name: portainer-auto-register
    image: curlimages/curl:8.21.0
    restart: on-failure:3
    depends_on:
      portainer:
        condition: service_started
      dind-platform:
        condition: service_started
    secrets:
      - portainer_admin_password
    volumes:
      - ./auto-register.sh:/auto-register.sh:ro
    environment:
      - PORTAINER_URL=https://portainer:9443
      - PORTAINER_PASSWORD_FILE=/run/secrets/portainer_admin_password
      - AGENT_ENDPOINT=dind-platform:9001
      - AGENT_NAME=dind-platform
    entrypoint: [ "/bin/sh", "/auto-register.sh" ]
    networks:
      - portainer-net

networks:
  portainer-net:
    name: portainer-net
    driver: bridge

secrets:
  portainer_admin_password:
    file: ./portainer_admin_password.txt

volumes:
  portainer_data:
    name: portainer_data
  dind-platform-data:
    name: dind-platform-data
  registry-proxy-data:
    name: registry-proxy-data
  # 代码托管/私有镜像仓库数据（复用 deAI/infra/devops 原卷，迁移数据不丢）
  devops_gitea_data:
    name: devops_gitea_data
  devops_registry_data:
    name: devops_registry_data
